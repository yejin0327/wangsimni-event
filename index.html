<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>왕십리점 시술금액</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f6f8;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

.container {
  width: min(100% - 24px, 760px);
  margin: auto;
  padding-bottom: 50px;
}

/* HEADER */

header {
  padding: 28px 0 18px;
}

.title {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1.5px;
}

.subtitle {
  margin-top: 7px;
  color: #888;
  font-size: 13px;
}

.update {
  margin-top: 15px;
  background: white;
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 12px;
  color: #777;
}

/* SEARCH */

.search-box {
  background: white;
  border-radius: 15px;
  padding: 15px;
  border: 1px solid #eee;
}

.search {
  display: flex;
  gap: 7px;
}

.search input {
  flex: 1;
  min-width: 0;
  border: 1px solid #ddd;
  border-radius: 9px;
  padding: 12px;
  outline: none;
}

.search input:focus {
  border-color: #111;
}

.search button {
  background: #111;
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 0 17px;
  cursor: pointer;
}

/* CATEGORY */

.categories {
  display: flex;
  overflow-x: auto;
  gap: 6px;
  margin-top: 13px;
  padding-bottom: 2px;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.categories button {
  flex: 0 0 auto;
  background: white;
  color: #777;
  border: 1px solid #ddd;
  border-radius: 30px;
  padding: 8px 13px;
  cursor: pointer;
}

.categories button.active {
  color: white;
  background: #111;
  border-color: #111;
}

/* OPTIONS */

.options {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 13px;
}

.options label {
  color: #666;
  font-size: 12px;
}

/* RESULT */

.result-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 18px 2px 9px;
}

.result-count {
  font-size: 14px;
  font-weight: 700;
}

.sort {
  border: 1px solid #ddd;
  background: white;
  border-radius: 8px;
  padding: 7px 9px;
  font-size: 12px;
}

/* CARD */

.card {
  background: white;
  border-radius: 14px;
  border: 1px solid #eee;
  padding: 16px;
  margin-bottom: 9px;
}

.card-category {
  color: #999;
  font-size: 11px;
  margin-bottom: 6px;
}

.card-title {
  font-size: 15px;
  line-height: 1.5;
  font-weight: 700;
  letter-spacing: -.3px;
}

.card-price {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 14px;
}

.price {
  font-size: 22px;
  font-weight: 800;
}

.normal {
  margin-top: 3px;
  color: #aaa;
  font-size: 12px;
  text-decoration: line-through;
}

.discount {
  color: #e74c5b;
  background: #fff0f2;
  border-radius: 7px;
  padding: 5px 7px;
  font-size: 11px;
  font-weight: 700;
}

.option {
  color: #8a6500;
  background: #fff8df;
  display: inline-block;
  padding: 3px 6px;
  border-radius: 5px;
  font-size: 10px;
  margin-top: 7px;
}

.source {
  display: block;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #f1f1f1;
  color: #999;
  text-decoration: none;
  font-size: 11px;
}

.source:hover {
  color: #111;
}

.empty {
  background: white;
  border-radius: 14px;
  text-align: center;
  padding: 50px 20px;
  color: #999;
}

/* LOADING */

.loading {
  background: white;
  border-radius: 14px;
  text-align: center;
  padding: 45px 20px;
  color: #888;
}

/* FOOTER */

footer {
  text-align: center;
  color: #aaa;
  font-size: 10px;
  line-height: 1.6;
  margin-top: 35px;
}

@media (max-width: 480px) {

  .container {
    width: calc(100% - 18px);
  }

  .title {
    font-size: 23px;
  }

  .search button {
    padding: 0 13px;
  }

  .card {
    padding: 14px;
  }

  .price {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>

  <div class="title">
    왕십리점 시술금액
  </div>

  <div class="subtitle">
    블리비 왕십리점 이벤트 가격 조회
  </div>

  <div class="update">
    📌 이벤트 기간
    <strong id="eventDate">확인 중...</strong>
    <br>
    🔄 데이터는 블리비 공식 이벤트 페이지 기준으로 업데이트됩니다.
  </div>

</header>


<section class="search-box">

  <div class="search">

    <input
      id="searchInput"
      type="search"
      placeholder="원하는 시술명을 입력해주세요."
      autocomplete="off"
    >

    <button id="searchButton">
      검색
    </button>

  </div>


  <div class="categories">

    <button class="active" data-category="전체">
      전체
    </button>

    <button data-category="기획전">
      기획전
    </button>

    <button data-category="쁘띠성형">
      쁘띠
    </button>

    <button data-category="피부">
      피부
    </button>

    <button data-category="리프팅">
      리프팅
    </button>

    <button data-category="부스터">
      부스터
    </button>

    <button data-category="제모">
      제모
    </button>

    <button data-category="비만">
      비만
    </button>

  </div>


  <div class="options">

    <label>
      <input
        type="checkbox"
        id="hideOption"
      >
      옵션 시술 제외
    </label>

    <label>
      <input
        type="checkbox"
        id="hideNormal"
      >
      정상가 숨기기
    </label>

  </div>

</section>


<div class="result-bar">

  <div
    class="result-count"
    id="resultCount"
  >
    이벤트 불러오는 중...
  </div>

  <select
    class="sort"
    id="sort"
  >

    <option value="default">
      기본순
    </option>

    <option value="low">
      가격 낮은순
    </option>

    <option value="high">
      가격 높은순
    </option>

    <option value="discount">
      할인율 높은순
    </option>

  </select>

</div>


<main id="results">

  <div class="loading">
    이벤트 정보를 불러오는 중입니다...
  </div>

</main>


<footer>

  본 페이지는 이벤트 가격 확인을 위한 정보 제공용 페이지입니다.<br>

  실제 가격 및 이벤트 조건은
  <a
    href="https://www.velyb.kr/community/community01.php?tb=event_multi&etc5=%EC%99%95%EC%8B%AD%EB%A6%AC%EC%A0%90&sField=6"
    target="_blank"
    rel="noopener"
  >
    블리비 공식 홈페이지
  </a>
  에서 확인해주세요.

</footer>

</div>


<script>

const SOURCE_URL =
"https://www.velyb.kr/community/community01.php?tb=event_multi&etc5=%EC%99%95%EC%8B%AD%EB%A6%AC%EC%A0%90&sField=6";

let events = [];

let currentCategory = "전체";


/* 숫자를 원화로 */

function money(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "";
  }

  return Number(value).toLocaleString("ko-KR") + "원";
}


/* JSON 불러오기 */

async function loadEvents() {

  const results =
    document.getElementById("results");

  try {

    const response =
      await fetch(
        "events.json?cache=" + Date.now()
      );

    if (!response.ok) {
      throw new Error("events.json을 찾을 수 없습니다.");
    }

    events = await response.json();

    if (!Array.isArray(events)) {
      throw new Error("데이터 형식이 올바르지 않습니다.");
    }

    updateDate();

    render();

  } catch (error) {

    console.error(error);

    results.innerHTML = `
      <div class="empty">
        <strong>이벤트 데이터를 불러오지 못했습니다.</strong>
        <br><br>
        자동 업데이트가 아직 실행되지 않았을 수 있습니다.
      </div>
    `;

    document.getElementById("resultCount").textContent =
      "데이터 준비 중";

  }

}


/* 업데이트 시간 */

function updateDate() {

  if (!events.length) return;

  const date =
    events[0].collected_at;

  if (!date) {

    document.getElementById("eventDate").textContent =
      "블리비 공식 홈페이지 확인";

    return;
  }

  const d = new Date(date);

  document.getElementById("eventDate").textContent =
    " " +
    d.toLocaleString("ko-KR") +
    " 기준";

}


/* 검색 */

function render() {

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const hideOption =
    document
      .getElementById("hideOption")
      .checked;

  const hideNormal =
    document
      .getElementById("hideNormal")
      .checked;

  const sort =
    document
      .getElementById("sort")
      .value;


  let filtered =
    events.filter(event => {

      if (
        currentCategory !== "전체" &&
        event.category !== currentCategory
      ) {
        return false;
      }

      if (
        hideOption &&
        event.option
      ) {
        return false;
      }

      if (
        keyword &&
        !String(event.name || "")
          .toLowerCase()
          .includes(keyword)
      ) {
        return false;
      }

      return true;

    });


  /* 정렬 */

  if (sort === "low") {

    filtered.sort(
      (a,b) =>
        Number(a.price || 0) -
        Number(b.price || 0)
    );

  }


  if (sort === "high") {

    filtered.sort(
      (a,b) =>
        Number(b.price || 0) -
        Number(a.price || 0)
    );

  }


  if (sort === "discount") {

    filtered.sort(
      (a,b) =>
        Number(b.discount || 0) -
        Number(a.discount || 0)
    );

  }


  document.getElementById("resultCount").textContent =
    `검색 결과 ${filtered.length}개`;


  const results =
    document.getElementById("results");


  if (!filtered.length) {

    results.innerHTML = `
      <div class="empty">
        검색 결과가 없습니다.
      </div>
    `;

    return;
  }


  results.innerHTML =
    filtered
      .map(event => {

        const normalPrice =
          !hideNormal && event.normal
          ? `
            <div class="normal">
              ${money(event.normal)}
            </div>
          `
          : "";


        const discount =
          event.discount
          ? `
            <span class="discount">
              ${event.discount}% OFF
            </span>
          `
          : "";


        const option =
          event.option
          ? `
            <div class="option">
              옵션/추가 시술
            </div>
          `
          : "";


        return `

          <article class="card">

            <div class="card-category">
              ${event.category || "이벤트"}
            </div>

            <div class="card-title">
              ${escapeHTML(event.name || "")}
            </div>

            ${option}

            <div class="card-price">

              <div>

                <div class="price">
                  ${money(event.price)}
                </div>

                ${normalPrice}

              </div>

              ${discount}

            </div>


            <a
              class="source"
              href="${SOURCE_URL}"
              target="_blank"
              rel="noopener"
            >
              블리비 공식 이벤트 페이지에서 확인 →
            </a>

          </article>

        `;

      })
      .join("");

}


/* HTML 안전 처리 */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* 카테고리 */

document
  .querySelectorAll(".categories button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".categories button")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        button.classList.add("active");

        currentCategory =
          button.dataset.category;

        render();

      }
    );

  });


/* 검색 버튼 */

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    render
  );


/* 엔터 검색 */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        render();
      }

    }
  );


/* 옵션 */

document
  .getElementById("hideOption")
  .addEventListener(
    "change",
    render
  );


document
  .getElementById("hideNormal")
  .addEventListener(
    "change",
    render
  );


document
  .getElementById("sort")
  .addEventListener(
    "change",
    render
  );


/* 시작 */

loadEvents();

</script>

</body>
</html>
