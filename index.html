    }

    }

    .search-box {

      padding: 18px;
      border-radius: 16px;

    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      background: #111;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .category {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 4px 0 2px;
      margin-bottom: 15px;
      scrollbar-width: none;
    }

    .category::-webkit-scrollbar {
      display: none;
    }

    .category button {
      flex: 0 0 auto;
      padding: 9px 14px;
      background: #fff;
      color: #666;
      border: 1px solid #e5e5e5;
      border-radius: 30px;
    }

    .category button.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 4px 2px 0;
    }

    .options label {
      font-size: 13px;
      color: #666;
      cursor: pointer;
    }

    .result-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 2px 10px;
    }

    .result-count {
      font-weight: 700;
      font-size: 15px;
    }

    select {
      border: 1px solid #ddd;
      background: white;
      padding: 8px 10px;
      border-radius: 8px;
    }

    .event-card {
      background: white;
      border-radius: 15px;
      margin-bottom: 10px;
      padding: 17px;
      border: 1px solid #eee;
    }

    .event-category {

    }

      font-size: 12px;

      font-size: 11px;

</head>

let currentCategory = "전체";


function money(number) {
  if (number === null || number === undefined) return "";
  return number.toLocaleString("ko-KR") + "원";
}


function render() {

  const keyword =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const hideOption =
    document.getElementById("hideOption").checked;

  const hideNormal =
    document.getElementById("hideNormal").checked;

  const sort =
    document.getElementById("sort").value;

  let filtered = events.filter(event => {

    if (
      currentCategory !== "전체" &&
      event.category !== currentCategory
    ) {
      return false;
    }

    if (
      hideOption &&
      event.option
    ) {
      return false;
    }

    if (
      keyword &&
      !event.name.toLowerCase().includes(keyword)
    ) {
      return false;
    }

    return true;
  });


  if (sort === "low") {
    filtered.sort((a,b) => a.price - b.price);
  }

  if (sort === "high") {
    filtered.sort((a,b) => b.price - a.price);
  }

  if (sort === "discount") {
    filtered.sort(
      (a,b) => (b.discount || 0) - (a.discount || 0)
    );
  }


  document.getElementById("count").textContent =
    `검색 결과 ${filtered.length}개`;


  const results =
    document.getElementById("results");


  if (!filtered.length) {

    results.innerHTML = `
      <div class="empty">
        검색 결과가 없습니다.
      </div>
    `;

    return;
  }


  results.innerHTML =
    filtered.map(event => {

      return `
        <article class="event-card">

          <div class="event-category">
            ${event.category}
          </div>

          <div class="event-name">
            ${event.name}
          </div>

          <div class="price-row">

            <div>

              <div class="price">
                ${money(event.price)}
              </div>

              ${
                !hideNormal && event.normal
                ? `
                  <div class="normal-price">
                    ${money(event.normal)}
                  </div>
                `
                : ""
              }

            </div>

            ${
              event.discount
              ? `
                <div class="discount">
                  ${event.discount}% OFF
                </div>
              `
              : ""
            }

          </div>

          <a
            class="source"
            href="${SOURCE_URL}"
            target="_blank"
            rel="noopener"
          >
            원본 이벤트 페이지에서 확인 →
          </a>

        </article>
      `;

    }).join("");
}


document.querySelectorAll(".category button")
.forEach(button => {

    document
      .querySelectorAll(".category button")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    currentCategory =
      button.dataset.category;

    render();

  });

});


document

  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      render();
    }

  });


document
  .getElementById("hideOption")
  .addEventListener("change", render);


document
